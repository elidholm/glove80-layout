name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read pinned community revision
        id: firmware
        run: echo "revision=$(< config/firmware-revision)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: moergo-sc/zmk
          ref: ${{ steps.firmware.outputs.revision }}
          path: src

      - name: Apply modifier RGB extension
        run: |
          git -C src apply --check "$PWD/patches/modifier-rgb.patch"
          git -C src apply "$PWD/patches/modifier-rgb.patch"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-22.05

      - uses: cachix/cachix-action@v17
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true

      - name: Build Glove80 combined firmware
        run: nix-build config -o combined

      - name: Test physical-key indication on both LED maps
        run: |
          nix-build tests --argstr half lh --no-out-link
          nix-build tests --argstr half rh --no-out-link

      - name: Copy result out of nix store
        run: cp combined/glove80.uf2 modifier-lighting.uf2

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: modifier-lighting.uf2
          path: modifier-lighting.uf2
